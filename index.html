<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CareNest helps home-care teams coordinate patients, caregivers, and schedules in one place.">
  <title>CareNest — Home Care, Connected</title>
  <style>
    :root {
      --site-primary: #176F66;
      --site-on-primary: #FFFFFF;
      --site-secondary: #EBC27B;
      --site-on-secondary: #263A38;
      --site-background: #F5F8F6;
      --site-on-background: #203A37;
      --site-font-body: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --site-font-heading: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --site-heading-scale: 1;
      --site-spacing-scale: 1;
      --site-radius-scale: 1;
      --site-decoration-opacity: 1;
      --teal-dark: #103E3A;
      --teal: #176F66;
      --teal-soft: #E3F1ED;
      --gold: #EBC27B;
      --ink: #203A37;
      --muted: #68807B;
      --line: #DCE7E2;
      --surface: #FFFFFF;
      --surface-soft: #F5F8F6;
      --green: #287D60;
      --red: #B84E4E;
      --orange: #B77A2C;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; font-family: var(--site-font-body); background: light-dark(#F5F8F6, #102421); color: light-dark(#203A37, #EAF4F0); }
    button, input, select, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    #app-root {
      min-height: 100vh;
      width: 100%;
      border-radius: 0;
      background-color: var(--site-background);
      background: light-dark(var(--site-background), #102421);
      color: light-dark(var(--site-on-background), #EAF4F0);
      overflow: hidden;
    }
    .container { width: min(1190px, calc(100% - 48px)); margin: 0 auto; }
    .eyebrow { display: inline-flex; align-items: center; gap: 8px; color: var(--teal); font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .eyebrow-dot { width: 7px; height: 7px; display: inline-block; background: var(--gold); border-radius: 50%; }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 850; color: var(--teal-dark); letter-spacing: -.04em; }
    .brand-mark { width: 37px; height: 37px; display: grid; place-items: center; border-radius: 12px; color: white; background: var(--teal); box-shadow: 0 7px 18px rgba(23,111,102,.18); }
    .brand-mark svg { width: 23px; height: 23px; }
    .brand-name { font-size: 20px; }
    .brand-name span { color: var(--teal); }
    .btn { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 9px; padding: 0 19px; border: 1px solid transparent; border-radius: calc(13px * var(--site-radius-scale)); background: var(--teal); color: white; font-weight: 750; box-shadow: 0 7px 18px rgba(23,111,102,.13); transition: transform .16s ease, box-shadow .16s ease, background .16s ease; }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 10px 23px rgba(23,111,102,.2); background: #105C54; }
    .btn svg { width: 17px; height: 17px; }
    .btn-gold { background: var(--gold); color: var(--teal-dark); box-shadow: none; }
    .btn-gold:hover { background: #F1D093; box-shadow: none; }
    .btn-outline { background: transparent; border-color: var(--line); box-shadow: none; color: var(--teal-dark); }
    .btn-outline:hover { background: var(--surface-soft); box-shadow: none; }
    .btn-sm { min-height: 36px; padding: 0 13px; border-radius: 10px; font-size: 12px; }
    .icon-btn { width: 38px; height: 38px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; display: grid; place-items: center; }
    .icon-btn svg { width: 18px; height: 18px; }

    /* Marketing site */
    .site-header { height: 78px; display: flex; align-items: center; border-bottom: 1px solid rgba(220,231,226,.7); background: light-dark(rgba(255,255,255,.8), rgba(16,36,33,.85)); backdrop-filter: blur(14px); }
    .nav-wrap { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .nav-links { display: flex; align-items: center; gap: 29px; color: light-dark(#536F69, #B0C5BE); font-size: 13px; font-weight: 650; }
    .nav-links a:hover { color: var(--teal); }
    .nav-actions { display: flex; align-items: center; gap: 10px; }
    .nav-menu { display: none; }
    .hero { position: relative; padding: 76px 0 78px; background: radial-gradient(ellipse at 77% 18%, rgba(235,194,123,.22), transparent 27%), linear-gradient(130deg, light-dark(#F5F8F6, #102421), light-dark(#FFFFFF, #17332E)); }
    .hero::before { content: ""; position: absolute; width: 430px; height: 430px; right: -155px; top: -180px; border: 1px solid rgba(23,111,102,.12); border-radius: 50%; opacity: var(--site-decoration-opacity); pointer-events: none; }
    .hero-grid { display: grid; grid-template-columns: 1fr 1.02fr; align-items: center; gap: 60px; position: relative; }
    .hero h1 { color: light-dark(#103E3A, #F0F7F4); font-family: var(--site-font-heading); font-size: calc(clamp(42px, 5.4vw, 67px) * var(--site-heading-scale)); line-height: 1.045; letter-spacing: -.065em; margin: 19px 0 22px; max-width: 630px; }
    .hero h1 em { color: var(--teal); font-style: normal; }
    .hero-copy { max-width: 540px; color: light-dark(#637D76, #B1C6BE); font-size: 17px; line-height: 1.8; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 11px; margin-top: 29px; }
    .hero-trust { display: flex; flex-wrap: wrap; align-items: center; gap: 17px; color: light-dark(#688079, #A8BDB5); font-size: 11px; margin-top: 25px; }
    .trust-item { display: flex; align-items: center; gap: 6px; }
    .trust-item svg { width: 15px; height: 15px; color: var(--teal); }
    .hero-demo { position: relative; min-width: 0; }
    .mock-window { padding: 13px; border: 1px solid light-dark(#D6E4DD, #2B4C45); background: light-dark(rgba(255,255,255,.76), rgba(19,49,43,.84)); border-radius: 22px; box-shadow: 0 30px 70px rgba(16,62,58,.16); transform: rotate(.8deg); }
    .mock-top { display: flex; justify-content: space-between; align-items: center; padding: 6px 9px 14px; }
    .mock-dots { display: flex; gap: 5px; }
    .mock-dots i { width: 6px; height: 6px; display: block; border-radius: 50%; background: #D4DFDA; }
    .mock-label { font-size: 10px; color: var(--muted); font-weight: 700; }
    .mock-content { display: grid; grid-template-columns: 115px 1fr; min-height: 276px; overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
    .mock-side { padding: 18px 12px; background: #F1F7F3; border-right: 1px solid var(--line); }
    .mock-brand { font-size: 12px; font-weight: 850; margin-bottom: 24px; color: var(--teal-dark); }
    .mock-nav { font-size: 9px; padding: 8px 7px; color: #728981; margin: 3px 0; border-radius: 6px; }
    .mock-nav.active { background: #DDEEE7; color: var(--teal); font-weight: 800; }
    .mock-main { padding: 19px; min-width: 0; }
    .mock-heading { display: flex; align-items: center; justify-content: space-between; color: var(--teal-dark); font-size: 14px; font-weight: 850; }
    .mock-date { font-size: 8px; color: var(--muted); font-weight: 500; }
    .mock-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 15px; }
    .mock-stat { padding: 10px 9px; border: 1px solid #E5ECE7; border-radius: 8px; }
    .mock-stat span { display: block; color: #789087; font-size: 7px; }
    .mock-stat strong { display: block; margin-top: 5px; color: var(--teal-dark); font-size: 18px; }
    .mock-lower { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 11px; }
    .mock-panel { border: 1px solid #E5ECE7; border-radius: 8px; padding: 11px; min-width: 0; }
    .mock-panel-title { font-size: 9px; font-weight: 800; color: var(--teal-dark); margin-bottom: 9px; }
    .mock-visit { display: flex; gap: 7px; align-items: center; margin: 9px 0; }
    .mock-avatar { width: 21px; height: 21px; border-radius: 7px; background: #DDEEE7; color: var(--teal); display: grid; place-items: center; font-size: 8px; font-weight: 800; }
    .mock-visit strong { display: block; font-size: 8px; color: #34544C; }
    .mock-visit span { display: block; font-size: 7px; color: #82948E; }
    .mini-bars { display: flex; align-items: end; height: 91px; gap: 7px; padding-top: 6px; }
    .mini-bar { flex: 1; border-radius: 4px 4px 1px 1px; background: #B9DBD0; }
    .mini-bar:nth-child(2n) { background: var(--teal); }
    .float-note { position: absolute; bottom: -21px; left: -24px; padding: 13px 16px; display: flex; align-items: center; gap: 11px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 30px rgba(16,62,58,.12); transform: rotate(-1.5deg); }
    .float-check { width: 31px; height: 31px; display: grid; place-items: center; border-radius: 10px; color: var(--teal); background: var(--teal-soft); }
    .float-note strong { display: block; font-size: 11px; }
    .float-note span { display: block; color: var(--muted); font-size: 9px; margin-top: 2px; }
    .proof-strip { background: var(--teal-dark); color: #DDECE6; padding: 24px 0; }
    .proof-inner { display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap; }
    .proof-lead { color: #B7CFC5; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; font-weight: 800; }
    .proof-items { display: flex; flex-wrap: wrap; gap: 28px; font-size: 13px; font-weight: 700; }
    .proof-items span { display: inline-flex; align-items: center; gap: 8px; }
    .proof-items svg { width: 16px; height: 16px; color: var(--gold); }
    .section { padding: 88px 0; }
    .section-head { max-width: 680px; margin: 0 auto 43px; text-align: center; }
    .section-head h2 { font-family: var(--site-font-heading); font-size: calc(clamp(29px, 3.6vw, 43px) * var(--site-heading-scale)); color: light-dark(#103E3A, #F0F7F4); letter-spacing: -.05em; line-height: 1.12; margin: 15px 0; }
    .section-head p { color: light-dark(#688079, #B1C6BE); line-height: 1.75; font-size: 15px; }
    .features-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 17px; }
    .feature-card { min-height: 220px; padding: 27px; border: 1px solid var(--line); border-radius: calc(20px * var(--site-radius-scale)); background: light-dark(#FFFFFF, #16332D); transition: transform .18s ease, box-shadow .18s ease; }
    .feature-card:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(16,62,58,.08); }
    .feature-icon { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 15px; color: var(--teal); background: var(--teal-soft); margin-bottom: 22px; }
    .feature-icon svg { width: 23px; height: 23px; }
    .feature-card h3 { color: light-dark(#103E3A, #EAF4F0); font-size: 16px; margin: 0 0 10px; }
    .feature-card p { color: light-dark(#688079, #B1C6BE); font-size: 13px; line-height: 1.75; margin: 0; }
    .workflow { background: light-dark(#EDF4F0, #132C27); }
    .workflow-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: center; }
    .workflow-copy h2 { color: light-dark(#103E3A, #F0F7F4); font-size: calc(clamp(30px, 3.6vw, 43px) * var(--site-heading-scale)); letter-spacing: -.05em; line-height: 1.12; margin: 15px 0; }
    .workflow-copy > p { color: light-dark(#688079, #B1C6BE); font-size: 14px; line-height: 1.8; }
    .step-list { list-style: none; padding: 0; display: grid; gap: 17px; margin: 28px 0 0; }
    .step-list li { display: flex; gap: 14px; align-items: flex-start; }
    .step-num { flex: 0 0 34px; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 12px; color: var(--teal); background: white; border: 1px solid var(--line); font-size: 12px; font-weight: 850; }
    .step-list strong { display: block; color: light-dark(#244C44, #DCECE5); font-size: 14px; margin: 2px 0 4px; }
    .step-list span:last-child { color: light-dark(#688079, #B1C6BE); font-size: 12px; line-height: 1.65; }
    .workflow-card { padding: 25px; border-radius: 24px; background: var(--teal-dark); color: white; box-shadow: 0 24px 55px rgba(16,62,58,.15); }
    .workflow-card-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-bottom: 19px; border-bottom: 1px solid rgba(255,255,255,.13); }
    .workflow-card-top strong { font-size: 14px; }
    .workflow-card-top span { font-size: 10px; color: #B8D1C7; }
    .workflow-row { display: flex; align-items: center; gap: 13px; padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,.1); }
    .workflow-row:last-child { border-bottom: 0; }
    .workflow-row-icon { width: 37px; height: 37px; border-radius: 12px; display: grid; place-items: center; background: rgba(255,255,255,.1); color: var(--gold); }
    .workflow-row-icon svg { width: 18px; height: 18px; }
    .workflow-row-copy { flex: 1; }
    .workflow-row-copy strong { display: block; font-size: 12px; }
    .workflow-row-copy span { display: block; color: #B7CFC5; font-size: 10px; margin-top: 3px; }
    .workflow-status { font-size: 9px; color: #C6EBDC; background: rgba(133,210,175,.12); padding: 5px 8px; border-radius: 20px; }
    .cta-section { padding: 76px 0; }
    .cta-card { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: space-between; gap: 30px; padding: 45px 50px; border-radius: 26px; background: var(--teal); color: white; }
    .cta-card::after { content: ""; width: 310px; height: 310px; border: 1px solid rgba(255,255,255,.15); border-radius: 50%; position: absolute; right: 100px; top: -210px; opacity: var(--site-decoration-opacity); }
    .cta-card h2 { position: relative; z-index: 1; font-size: calc(clamp(26px, 3.2vw, 38px) * var(--site-heading-scale)); letter-spacing: -.045em; line-height: 1.15; margin: 0 0 10px; }
    .cta-card p { position: relative; z-index: 1; margin: 0; font-size: 13px; color: #D3E6DF; line-height: 1.65; }
    .cta-card .btn { position: relative; z-index: 1; flex: 0 0 auto; }
    .site-footer { padding: 25px 0; border-top: 1px solid var(--line); color: light-dark(#70857D, #9BB2A9); font-size: 11px; }
    .footer-inner { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 15px; }

    /* Demo dashboard */
    .dashboard-shell { min-height: 100vh; display: grid; grid-template-columns: 238px minmax(0,1fr); background: light-dark(#F4F7F5, #102421); color: light-dark(#203A37, #EAF4F0); }
    .sidebar { background: light-dark(#FFFFFF, #15302B); border-right: 1px solid var(--line); padding: 23px 16px; display: flex; flex-direction: column; min-height: 100vh; }
    .sidebar .brand { padding: 0 9px 28px; }
    .sidebar-section-label { padding: 0 12px; color: light-dark(#93A69E, #78978C); font-size: 9px; letter-spacing: .15em; font-weight: 850; text-transform: uppercase; margin: 12px 0 10px; }
    .side-link { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px 13px; border: 0; background: transparent; color: light-dark(#647D74, #A8C1B7); border-radius: 12px; font-size: 12px; font-weight: 700; margin: 2px 0; }
    .side-link svg { width: 17px; height: 17px; }
    .side-link:hover { background: light-dark(#F1F6F3, #1B3B34); color: var(--teal); }
    .side-link.active { background: var(--teal-soft); color: var(--teal); }
    .sidebar-bottom { margin-top: auto; }
    .help-card { margin: 20px 3px 15px; padding: 15px; background: light-dark(#F3F7F4, #1B3B34); border: 1px solid var(--line); border-radius: 15px; }
    .help-card strong { font-size: 11px; color: light-dark(#355D52, #DCECE5); display: block; margin-bottom: 5px; }
    .help-card p { margin: 0 0 10px; color: light-dark(#7B9188, #A8C1B7); font-size: 10px; line-height: 1.6; }
    .help-card button { width: 100%; min-height: 30px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; color: var(--teal); font-size: 10px; font-weight: 800; }
    .profile { display: flex; gap: 9px; align-items: center; padding: 14px 8px 0; border-top: 1px solid var(--line); }
    .profile-avatar { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: #D9EBE4; color: var(--teal); font-size: 10px; font-weight: 900; }
    .profile strong { display: block; font-size: 11px; }
    .profile span { display: block; color: var(--muted); font-size: 9px; margin-top: 3px; }
    .dash-main { min-width: 0; }
    .dash-topbar { height: 74px; padding: 0 30px; display: flex; justify-content: space-between; align-items: center; gap: 16px; border-bottom: 1px solid var(--line); background: light-dark(rgba(255,255,255,.7), rgba(18,43,38,.82)); }
    .breadcrumbs { color: var(--muted); font-size: 11px; }
    .breadcrumbs strong { color: light-dark(#23483F, #DFECE6); }
    .topbar-actions { display: flex; align-items: center; gap: 10px; }
    .demo-chip { display: flex; align-items: center; gap: 7px; padding: 7px 10px; border-radius: 8px; border: 1px solid #E2CC9C; background: #FFF7E8; color: #86652D; font-size: 10px; font-weight: 800; }
    .demo-chip span { width: 6px; height: 6px; border-radius: 50%; background: #D5A447; }
    .dash-content { padding: 29px 30px 36px; max-width: 1450px; margin: 0 auto; }
    .page-heading { display: flex; justify-content: space-between; align-items: flex-start; gap: 17px; margin-bottom: 25px; }
    .page-heading h1 { color: light-dark(#173D36, #F0F7F4); font-size: calc(27px * var(--site-heading-scale)); letter-spacing: -.05em; line-height: 1.2; margin: 0 0 7px; }
    .page-heading p { color: var(--muted); font-size: 12px; margin: 0; }
    .heading-actions { display: flex; flex-wrap: wrap; gap: 9px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; margin-bottom: 20px; }
    .stat-card { padding: 18px; background: light-dark(#FFFFFF, #16332D); border: 1px solid var(--line); border-radius: 16px; min-width: 0; }
    .stat-card-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--muted); font-size: 10px; font-weight: 700; }
    .stat-icon { width: 33px; height: 33px; display: grid; place-items: center; border-radius: 11px; background: var(--teal-soft); color: var(--teal); }
    .stat-icon svg { width: 17px; height: 17px; }
    .stat-num { display: block; font-size: 29px; letter-spacing: -.06em; font-weight: 850; color: light-dark(#173D36, #EAF4F0); margin-top: 13px; }
    .stat-foot { font-size: 10px; color: var(--muted); margin-top: 4px; }
    .trend { color: var(--green); font-weight: 800; }
    .overview-grid { display: grid; grid-template-columns: minmax(0,1.45fr) minmax(280px,.9fr); gap: 16px; }
    .panel { background: light-dark(#FFFFFF, #16332D); border: 1px solid var(--line); border-radius: 17px; min-width: 0; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 19px 20px; border-bottom: 1px solid var(--line); }
    .panel-head h2 { font-size: 13px; color: light-dark(#254A41, #DFECE6); margin: 0; }
    .panel-head p { font-size: 10px; color: var(--muted); margin: 4px 0 0; }
    .text-link { color: var(--teal); font-size: 10px; font-weight: 850; border: 0; background: transparent; }
    .chart-area { padding: 19px 20px 16px; }
    .chart-summary { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
    .chart-summary strong { font-size: 25px; color: light-dark(#173D36, #EAF4F0); letter-spacing: -.05em; }
    .chart-summary span { font-size: 10px; color: var(--muted); }
    .bar-chart { height: 160px; display: flex; align-items: end; gap: clamp(7px, 2.1vw, 19px); border-bottom: 1px solid var(--line); padding: 0 3px; }
    .bar-column { height: 100%; display: flex; align-items: center; justify-content: end; flex-direction: column; flex: 1; gap: 8px; min-width: 0; }
    .bar-value { font-size: 9px; font-weight: 800; color: var(--muted); }
    .bar { width: min(100%, 28px); border-radius: 6px 6px 2px 2px; background: #B9DCCF; min-height: 5px; transition: height .2s ease; }
    .bar.today { background: var(--teal); }
    .bar-label { color: var(--muted); font-size: 9px; padding-top: 10px; }
    .chart-legend { display: flex; gap: 15px; margin-top: 16px; font-size: 9px; color: var(--muted); }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-dot { width: 7px; height: 7px; border-radius: 3px; background: var(--teal); }
    .legend-dot.pale { background: #B9DCCF; }
    .visits-list { padding: 6px 19px 12px; }
    .visit-item { padding: 13px 0; display: flex; align-items: flex-start; gap: 11px; border-bottom: 1px solid light-dark(#EDF2EF, #27453E); }
    .visit-item:last-child { border-bottom: 0; }
    .visit-time { min-width: 47px; color: var(--teal); font-size: 10px; font-weight: 850; padding-top: 3px; }
    .visit-details { flex: 1; min-width: 0; }
    .visit-details strong { display: block; font-size: 11px; color: light-dark(#2A4E44, #E0ECE6); }
    .visit-details span { display: block; font-size: 9px; color: var(--muted); margin-top: 4px; }
    .status-pill { display: inline-flex; align-items: center; white-space: nowrap; padding: 5px 8px; border-radius: 30px; background: #E2F2E9; color: #287D60; font-size: 9px; font-weight: 800; }
    .status-pill.review { background: #FFF1D8; color: #A76A20; }
    .status-pill.inactive { background: #FCE8E7; color: #A94B4B; }
    .table-panel { overflow: hidden; }

  }
  function statusPill(status) {
    const cls = status === 'Review' || status === 'Pending' || status === 'On visit' ? 'review' : (status === 'Off duty' || status === 'Inactive' ? 'inactive' : '');
    return `<span class="status-pill ${cls}">${esc(status)}</span>`;
  }
  function renderOverview() {
    const today = todayVisits();
    const activePatients = data.patients.filter(p => p.status === 'Active').length;
    const available = data.caregivers.filter(c => c.status === 'Available').length;
    const week = [6,5,4,3,2,1,0].map((offset, index) => {
      const date = dateOffset(-offset);
      const count = data.visits.filter(v => v.date === date).length;
      return { day: new Intl.DateTimeFormat(undefined, {weekday:'short'}).format(new Date(`${date}T12:00:00`)), count, isToday: offset === 0 };
    });
    const peak = Math.max(4, ...week.map(w => w.count));
    return `<div class="page-heading"><div><h1>Good ${new Date().getHours() < 12 ? 'morning' : new Date().getHours() < 18 ? 'afternoon' : 'evening'}, Alex</h1><p>Here's what's happening across your care team today.</p></div><div class="heading-actions"><button class="btn btn-outline btn-sm" data-action="navigate" data-page="Schedule">${icons.calendar} View schedule</button><button class="btn btn-sm" data-action="open-modal" data-type="visit">${icons.plus} Add visit</button></div></div>

  }

  function backHome() {
    modalType = null;
    if (location.hash !== '#home') location.hash = 'home';
    renderLanding();
    window.scrollTo(0,0);
  }
  function showToast(message) {
    document.querySelector('.toast')?.remove();
    const toast = document.createElement('div'); toast.className = 'toast'; toast.textContent = message; document.body.appendChild(toast);
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.remove(), 3000);
  }
  function openModal(type) {
    if (type === 'visit' && (!data.patients.length || !data.caregivers.length)) {
      showToast('Add at least one patient and caregiver before scheduling a visit.'); return;
    }
    modalType = type; renderDashboard();
    setTimeout(() => document.querySelector('#recordForm input, #recordForm select')?.focus(), 50);
  }
  function saveRecord(form) {
    const fd = new FormData(form);
    if (modalType === 'patient') {
      const name = `${fd.get('firstName').trim()} ${fd.get('lastName').trim()}`;
      const nextNumber = Math.max(1041, ...data.patients.map(p => Number(p.id.replace(/\D/g,'')) || 0)) + 1;
      data.patients.unshift({ id: `PT-${nextNumber}`, name, age: Number(fd.get('age')) || 0, care: fd.get('care'), status: 'Active', city: String(fd.get('city') || '').trim() || 'Not specified' });
      activePage = 'Patients'; searchTerm = ''; statusFilter = 'All statuses'; modalType = null; renderDashboard(); showToast(`${name} added to the demo patient directory.`);
    } else if (modalType === 'caregiver') {
      const name = `${fd.get('firstName').trim()} ${fd.get('lastName').trim()}`;
      const nextNumber = Math.max(200, ...data.caregivers.map(c => Number(c.id.replace(/\D/g,'')) || 0)) + 1;
      data.caregivers.unshift({ id: `CG-${nextNumber}`, name, role: fd.get('role'), status: 'Available', phone: String(fd.get('phone') || '').trim() || 'Not provided' });
      activePage = 'Caregivers'; searchTerm = ''; statusFilter = 'All statuses'; modalType = null; renderDashboard(); showToast(`${name} added to the demo caregiver directory.`);
    } else if (modalType === 'visit') {
      const nextNumber = Math.max(500, ...data.visits.map(v => Number(v.id.replace(/\D/g,'')) || 0)) + 1;
      data.visits.push({ id: `VS-${nextNumber}`, patientId: fd.get('patientId'), caregiverId: fd.get('caregiverId'), date: fd.get('visitDate'), time: fd.get('visitTime'), duration: fd.get('duration'), service: fd.get('service'), status: fd.get('visitStatus') });
      activePage = 'Schedule'; searchTerm = ''; statusFilter = 'All statuses'; modalType = null; renderDashboard(); showToast('Visit added to the demo schedule.');
    }
  }

  appRoot.addEventListener('click', (event) => {
    const actionEl = event.target.closest('[data-action]');
    if (!actionEl) return;
    const action = actionEl.dataset.action;
    if (action === 'launch-demo') launchDemo();
    else if (action === 'back-home') backHome();
    else if (action === 'navigate') { activePage = actionEl.dataset.page; searchTerm = ''; statusFilter = 'All statuses'; modalType = null; renderDashboard(); }
    else if (action === 'open-modal') openModal(actionEl.dataset.type);
    else if (action === 'close-modal') { modalType = null; renderDashboard(); }
    else if (action === 'dismiss-modal' && event.target === actionEl) { modalType = null; renderDashboard(); }
    else if (action === 'notify') showToast('You are all caught up in this demo.');
    else if (action === 'mobile-menu') showToast('Use Launch demo to open the interactive workspace.');
    else if (action === 'patient-details') { const p = getPatient(actionEl.dataset.id); if (p) showToast(`${p.name} · ${p.care} · ${p.status}`); }
    else if (action === 'caregiver-details') { const c = getCaregiver(actionEl.dataset.id); if (c) showToast(`${c.name} · ${c.role} · ${c.status}`); }
  });
  appRoot.addEventListener('submit', (event) => {
    if (event.target.id !== 'recordForm') return;
    event.preventDefault();
    if (!event.target.reportValidity()) return;
    saveRecord(event.target);
  });
  appRoot.addEventListener('input', (event) => {
    if (event.target.id === 'tableSearch') {
      searchTerm = event.target.value;
      const target = event.target;
      const position = target.selectionStart;
      renderDashboard();
      const newInput = document.getElementById('tableSearch');
      if (newInput) { newInput.focus(); newInput.setSelectionRange(position, position); }
    }
  });
  appRoot.addEventListener('change', (event) => {
    if (event.target.id === 'statusFilter') { statusFilter = event.target.value; renderDashboard(); }
  });
  window.addEventListener('hashchange', () => {
    if (location.hash === '#demo') renderDashboard();
    else renderLanding();
  });
  if (location.hash === '#demo') renderDashboard(); else renderLanding();
</script>
</body>
</html>
